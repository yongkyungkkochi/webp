<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let number = prompt('정수를 입력하세요.');
    if ( number >= 90 ) {
        alert('A입니다.');
    } else if ( number >= 80 ) {
        alert('B입니다.');
    } else if ( number >= 70 ) {
        alert('C입니다.');
    } else if ( number >= 60 ) {
        alert('D입니다.');
    } else {
        alert('F입니다.');
    }
</script>
<body>
    <h1>JS 조건문</h1>
</body>
</html>
