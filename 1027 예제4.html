<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
let number = prompt('정수를 입력하세요.');
</script>
<body>
    <h1>JS 조건문</h1>
    <hr>    
    <h1>JS 반복문</h1>
    <script>
        let num = 1;
        while (num <= number) {
            document.write(num + '<br>');
            num++;
        }
        for (num = 1; num <= number; num++) {
            document.write(num + '<br>');
        }

        let sum = 0;
        let i = 1;
        for (i = 1; i <= number; i++) {
            sum = sum + i;
        }
        document.write(sum+'<br>');
    </script>
</body>
</html>
