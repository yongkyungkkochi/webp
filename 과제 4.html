<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계산기</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9edf0; --body:#2b3a42; --screen:#cfe3d4; --screen-ink:#1d2b22;
  --key:#fbfcfc; --key-ink:#1f2a30; --key-shadow:#b7c1c7;
  --op:#3d5a6c; --op-ink:#fff; --eq:#e0903a; --eq-ink:#2a1a05; --fn:#d5dde2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191c; --body:#1d262b; --screen:#a9c3b0; --screen-ink:#142019;
    --key:#2c383f; --key-ink:#eef3f5; --key-shadow:#0d1214;
    --op:#4c7186; --fn:#3a4850;
  }
}
:root[data-theme="dark"]{
  --bg:#14191c; --body:#1d262b; --screen:#a9c3b0; --screen-ink:#142019;
  --key:#2c383f; --key-ink:#eef3f5; --key-shadow:#0d1214;
  --op:#4c7186; --fn:#3a4850;
}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
.calc{width:min(340px,92vw);background:var(--body);border-radius:22px;padding:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:12px;padding:12px 16px;
  text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25);overflow:hidden}
.expr{font-size:14px;min-height:20px;opacity:.7;white-space:nowrap;overflow-x:auto}
.value{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:38px;font-weight:600;
  white-space:nowrap;overflow-x:auto;line-height:1.2}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
button{font:inherit;font-size:20px;font-weight:500;border:0;border-radius:12px;height:58px;cursor:pointer;
  background:var(--key);color:var(--key-ink);box-shadow:0 3px 0 var(--key-shadow);
  transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-shadow)}
button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.fn{background:var(--fn)}
.op{background:var(--op);color:var(--op-ink)}
.eq{background:var(--eq);color:var(--eq-ink);grid-row:span 2;height:auto}
.zero{grid-column:span 2}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="calc" role="application" aria-label="계산기">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="sign">±</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-act="dot">.</button>
    <button class="eq" data-act="equals">=</button>

    <button class="fn zero" data-act="back">⌫ 지우기</button>
  </div>
</div>

<script>
(function(){
  var valueEl=document.getElementById('value');
  var exprEl=document.getElementById('expr');
  var SYM={'+':'+','-':'−','*':'×','/':'÷'};
  var current='0', prev=null, op=null, fresh=false, error=false;

  function fmt(s){
    if(s==='오류') return s;
    var neg=s[0]==='-'; if(neg) s=s.slice(1);
    var p=s.split('.');
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+p.join('.');
  }
  function show(){
    valueEl.textContent=fmt(current);
    exprEl.textContent=(prev!==null&&op)?fmt(String(prev))+' '+SYM[op]:'';
  }
  function compute(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    var r;
    if(o==='+') r=a+b;
    else if(o==='-') r=a-b;
    else if(o==='*') r=a*b;
    else if(o==='/'){ if(b===0) return null; r=a/b; }
    return parseFloat(r.toPrecision(12));
  }
  function setError(){ current='오류'; prev=null; op=null; error=true; show(); }
  function reset(){ current='0'; prev=null; op=null; fresh=false; error=false; show(); }

  function inputNum(d){
    if(error) reset();
    if(fresh){ current='0'; fresh=false; }
    if(current.replace(/[-.]/g,'').length>=15) return;
    current = current==='0' ? d : current+d;
    show();
  }
  function inputDot(){
    if(error) reset();
    if(fresh){ current='0'; fresh=false; }
    if(current.indexOf('.')<0) current+='.';
    show();
  }
  function setOp(o){
    if(error) return;
    if(op && !fresh){
      var r=compute(prev,current,op);
      if(r===null) return setError();
      prev=r; current=String(r);
    } else {
      prev=parseFloat(current);
    }
    op=o; fresh=true; show();
  }
  function equals(){
    if(error||!op) return;
    var r=compute(prev,current,op);
    if(r===null) return setError();
    exprEl.textContent=fmt(String(prev))+' '+SYM[op]+' '+fmt(current)+' =';
    current=String(r); prev=null; op=null; fresh=true;
    valueEl.textContent=fmt(current);
  }
  function back(){
    if(error) return reset();
    if(fresh) return;
    current=current.length>1&&!(current.length===2&&current[0]==='-')?current.slice(0,-1):'0';
    show();
  }
  function sign(){
    if(error||current==='0') return;
    current=current[0]==='-'?current.slice(1):'-'+current; show();
  }
  function percent(){
    if(error) return;
    current=String(parseFloat((parseFloat(current)/100).toPrecision(12))); show();
  }

  document.querySelector('.keys').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.num!==undefined) inputNum(b.dataset.num);
    else if(b.dataset.op) setOp(b.dataset.op);
    else switch(b.dataset.act){
      case 'clear': reset(); break;
      case 'sign': sign(); break;
      case 'percent': percent(); break;
      case 'dot': inputDot(); break;
      case 'equals': equals(); break;
      case 'back': back(); break;
    }
  });

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(/^[0-9]$/.test(k)) inputNum(k);
    else if(k==='.') inputDot();
    else if('+-*/'.indexOf(k)>=0){ e.preventDefault(); setOp(k); }
    else if(k==='Enter'||k==='='){ e.preventDefault(); equals(); }
    else if(k==='Backspace') back();
    else if(k==='Escape') reset();
    else if(k==='%') percent();
  });

  show();
})();
</script>
</body>
</html>
